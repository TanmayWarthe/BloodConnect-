# Active profile — override with SPRING_PROFILES_ACTIVE env var on Render
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

spring.application.name=bloodconnect-backend
server.port=8080

# ============================================================
# Database Configuration (MySQL Local)
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/bloodconnect?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=STW@0427
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool tuning
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ============================================================
# Hibernate / JPA Configuration
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# JWT Configuration
# ============================================================
jwt.secret=BloodConnect_MySQL_JWT_Secret_Key_2026_Must_Be_At_Least_256_Bits_Long
jwt.expiration-ms=86400000

# ============================================================
# Logging
# ============================================================
logging.level.com.bloodconnect=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================================
# Server error handling
# ============================================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
