spring.application.name=bloodconnect-backend
server.port=8080

# ============================================================
# Database Configuration (Supabase PostgreSQL)
# ============================================================
spring.datasource.url=${APP_DB_URL:jdbc:postgresql://db.gawzojsrgpcjydbackso.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${APP_DB_USERNAME:postgres}
spring.datasource.password=${APP_DB_PASSWORD:STW@0427}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool tuning
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ============================================================
# Hibernate / JPA Configuration
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ============================================================
# Firebase Configuration
# ============================================================
firebase.config.path=${FIREBASE_CONFIG_PATH:classpath:serviceAccountKey.json}

# ============================================================
# Logging
# ============================================================
logging.level.com.bloodconnect=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================================
# Server error handling
# ============================================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
